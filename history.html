<!DOCTYPE html>
<html>
<head>
<title>Prediction History</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="navbar">
MaintainX AI
<a href="/dashboard">Dashboard</a>
<a href="/logout">Logout</a>
</div>

<div class="container">

<h2>Prediction History</h2>

<table border="1" width="100%">

<tr>
<th>Machine ID</th>
<th>Health Score</th>
<th>Risk Level</th>
<th>Failure Probability</th>
<th>Prediction Time</th>
</tr>

{% for row in data %}

<tr>
<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
<td>{{row[4]}}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
