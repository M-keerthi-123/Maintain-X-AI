<!DOCTYPE html>
<html>
<head>
<title>User Management</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="navbar">
Admin Panel
<a href="/admin_dashboard">Dashboard</a>
</div>

<div class="container">

<div class="card">

<h2>Users</h2>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for u in users %}

<tr>

<td>{{u[0]}}</td>
<td>{{u[1]}}</td>
<td>{{u[2]}}</td>
<td>{{u[4]}}</td>
<td>{{u[5]}}</td>

<td>
<a href="/admin/delete_user/{{u[0]}}" onclick="return confirm('Delete this user?')">
Delete
</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</body>
</html>
